#VRML_SIM R2025a utf8

PROTO CyanRobot [
  field SFVec3f    translation 0 0 0
  field SFRotation rotation    0 0 1 0
  field SFString   controller  "cyan_robot"
]
{
  Robot {
    translation IS translation
    rotation    IS rotation
    name        "cyan_robot"
    controller  IS controller
    children [
      DEF BODY Shape {
        appearance PBRAppearance {
          baseColor 0 1 1
          roughness 0.6
          metalness 0.1
        }
        geometry Box {
          size 0.7 0.5 0.25
        }
      }
      HingeJoint {
        jointParameters HingeJointParameters {
          axis 0 1 0
          anchor 0 0.3 0
        }
        device [
          RotationalMotor {
            name "left wheel motor"
            maxVelocity 10
          }
        ]
        endPoint Solid {
          translation 0 0.3 0
          rotation 1 0 0 1.5708
          name "left wheel"
          children [
            Shape {
              appearance PBRAppearance { baseColor 0.15 0.15 0.15 }
              geometry Cylinder { radius 0.13 height 0.04 }
            }
          ]
          boundingObject Cylinder { radius 0.13 height 0.04 }
          physics Physics {}
        }
      }
      HingeJoint {
        jointParameters HingeJointParameters {
          axis 0 1 0
          anchor 0 -0.3 0
        }
        device [
          RotationalMotor {
            name "right wheel motor"
            maxVelocity 10
          }
        ]
        endPoint Solid {
          translation 0 -0.3 0
          rotation 1 0 0 1.5708
          name "right wheel"
          children [
            Shape {
              appearance PBRAppearance { baseColor 0.15 0.15 0.15 }
              geometry Cylinder { radius 0.13 height 0.04 }
            }
          ]
          boundingObject Cylinder { radius 0.13 height 0.04 }
          physics Physics {}
        }
      }
      Solid {
        translation 0.3 0 -0.09
        name "caster"
        children [
          Shape { geometry Sphere { radius 0.04 } }
        ]
        boundingObject Sphere { radius 0.04 }
        physics Physics {}
      }
      GPS {
        name "gps"
      }
      Compass {
        name "compass"
      }
      Camera {
        translation 0.36 0 0.04
        rotation 0 1 0 0.25
        name "camera"
        fieldOfView 1.2
        width 160
        height 120
      }
      DistanceSensor {
        translation 0.36 0 0.04
        rotation 0 0 1 0
        name "front_sensor"
        type "generic"
        numberOfRays 3
        aperture 0.3
      }
    ]
    boundingObject Box {
      size 0.7 0.5 0.25
    }
    physics Physics {
      density -1
      mass 4
    }
  }
}
